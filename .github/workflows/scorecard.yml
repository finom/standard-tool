name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '27 6 * * 2'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result
      id-token: write # sign the published result
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true # required for the README badge
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
