version: 2
updates:
  # Keeps the digest-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # init and analyze fail on different versions
    groups:
      codeql:
        patterns: ["github/codeql-action/*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
