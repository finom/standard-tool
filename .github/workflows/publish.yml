name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      # A mistyped tag would otherwise publish whatever version package.json happens to hold.
      - name: Check the tag matches package.json and jsr.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          jsr="$(node -p 'require("./jsr.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi
          if [ "$tag" != "$jsr" ]; then
            echo "tag v$tag does not match jsr.json $jsr" >&2
            exit 1
          fi
      - run: npm publish --provenance --access public
      # JSR authenticates through the same OIDC token, so there is no registry secret.
      - run: npx jsr publish

  # Scorecard's Signed-Releases reads GitHub release assets, not npm.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    steps:
      - name: Attach the npm provenance to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          file="$GITHUB_REF_NAME.intoto.jsonl"
          # npm serves the attestations a few minutes after the publish.
          curl -fsSL --retry 40 --retry-delay 15 --retry-all-errors \
            "https://registry.npmjs.org/-/npm/v1/attestations/standard-tool@$version" |
            jq -ce '.attestations[] | select(.predicateType | startswith("https://slsa.dev/provenance/")) | .bundle.dsseEnvelope' \
            >"$file"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$file" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$file" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes "[Changelog](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md) · [npm](https://www.npmjs.com/package/standard-tool/v/$version)"
          fi
